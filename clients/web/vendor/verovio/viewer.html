<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PianoFlow Verovio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #FFFBF5;
      overflow: hidden;
      height: 100%;
      width: 100%;
      font-family: system-ui, sans-serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFFBF5;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      /* Clip only — scroll via #svg translate3d (subpixel, no scrollLeft snap). */
      overflow: hidden;
      background: #FFFBF5;
    }
    #svg {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      /* Top-align by default — centering a tall grand staff clips bass clef. */
      align-items: flex-start;
      height: auto;
      /* Hug the engraved system. A 100% min-height painted cream under a short staff. */
      min-height: 0;
      width: max-content;
      max-height: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      background: #FFFBF5;
    }
    /* Do NOT force nested svg to 100%x100% — that collapsed ink to empty cream
       in WebView2. Explicit px sizing is applied in JS after render. */
    #svg > svg {
      display: inline-block;
      vertical-align: top;
      background: #FFFBF5;
      overflow: visible;
      flex: 0 0 auto;
    }
    #svg svg.definition-scale {
      overflow: visible;
    }
    /* Backup if a part-name label still slips through engraving */
    #svg g.label,
    #svg g.labelAbbr {
      display: none !important;
    }
    #svg g.mnum {
      pointer-events: none;
    }
    #status {
      position: absolute;
      left: 8px;
      top: 6px;
      color: #666;
      font-size: 12px;
      pointer-events: none;
      z-index: 6;
    }
    /* Viewport-fixed overlay (outside #wrap) — left is view X, not content X */
    #playhead {
      position: absolute;
      top: 0;
      left: 0;
      /* Screen-space bar (~Flowkey). JS may narrow with strip fit; never stretch. */
      width: 12px;
      height: 100%;
      background: rgba(232, 168, 73, 0.55);
      pointer-events: none;
      z-index: 5;
      display: none;
      box-shadow: none;
      border-radius: 2px;
      max-width: 12px;
      min-width: 5px;
      transform: none;
      box-sizing: border-box;
    }
    /* Full-score browse: vertical page stack + native scroll. */
    body.pf-browse #wrap {
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    body.pf-browse #svg {
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: center;
      width: 100%;
      min-height: 0;
      height: auto;
      transform: none !important;
      will-change: auto;
      gap: 12px;
      padding: 8px 0 24px;
      box-sizing: border-box;
    }
    body.pf-browse #svg > svg {
      display: block;
      margin: 0 auto;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
    }
    body.pf-browse #playhead {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="status">正在加载谱面引擎…</div>
  <div id="stage">
    <div id="wrap">
      <div id="svg"></div>
    </div>
    <div id="playhead"></div>
  </div>
  <script src="verovio-toolkit-wasm.js"></script>
  <script>
    let toolkit = null;
    let bpm = 100;
    let ready = false;
    let timemap = [];
    /** Last async/sync load error string for Dart (pfScoreInfo.loadErr). */
    let lastLoadErr = null;
    /** Last MusicXML — resize re-engraves without Flutter re-pushing the score. */
    let lastMusicXml = '';
    /** Sorted {q,x} onset samples for continuous beat→X (content coords). */
    let beatXPoints = [];
    /** Playhead locked near 30% of viewport during playback; score scrolls underneath. */
    const ANCHOR = 0.30;
    /**
     * Keep in sync with PracticeConstants.playbackLeadInBeats.
     * Negative transport beats ease the playhead from lead-in toward the first note.
     */
    const PLAYBACK_LEAD_IN_BEATS = 1.0;
    const SEEK_BEAT_EPS = 0.35; // larger jump → snap scroll (seek / stall recovery)
    /**
     * Unified transport: Dart positionBeats is the only clock (same as waterfall
     * + guide audio). JS may ease ≤ this many seconds between bridge ticks —
     * never free-run. Sized to cover typical WebView executeScript RTT.
     */
    const MAX_EXTRAPOLATE_SEC = 0.10;
    /** Keep rAF only while Dart recently confirmed play (ms). */
    const DART_LIVE_MS = 500;
    /** Soft catch-up only when paused (rate==0); play always hard-tracks. */
    const SCROLL_CATCHUP = 0.65;
    /** Hard-correct scroll if visual lag exceeds this (px) when paused. */
    const DRIFT_SNAP_PX = 3;
    /** Cached leftmost note X — lead-in floor uses measure left when available. */
    let firstNoteX = null;
    let startLeadFloorX = 0;
    /**
     * First *sounding* onset q (before seedStartBeatX may unshift q=0).
     * Lead-in / start park must use this — not beatXPoints[0].q — so late-onset
     * pieces parked at onset−lead still show the playhead at the staff left.
     */
    let firstSoundingQ = 0;
    /** Right edge of engraved score (last measure) for end-of-piece playhead travel. */
    let scoreEndX = null;

    let targetContentX = 0;
    let lastBeats = 0;
    let displayBeats = 0;
    let scrollX = 0; // fractional content offset (replaces scrollLeft)
    /**
     * When engraved strip width < lane width, shift so the strip sits centered
     * (idle / short scores / wide windows). Scroll sx still subtracts from this.
     */
    let contentCenterPadX = 0;
    let scrollRaf = null;
    let forceSnap = false;
    /** Dart transport rate (beats/sec). 0 = paused. No independent JS clock. */
    let beatsPerSec = 0;
    let lastSyncTime = 0;
    let liveUntil = 0;
    /** Queued when pfLoadFromUrlAsync runs before WASM toolkit is ready. */
    let pendingLoad = null;
    /**
     * 'strip' = practice continuous horizontal system (default).
     * 'paged' = full-score browse: Verovio page breaks + vertical stack.
     */
    let layoutMode = 'strip';
    /** 1-based current page while browsing (for pfSetPage / buttons). */
    let currentBrowsePage = 1;

    function postToHost(payload) {
      var s = typeof payload === 'string' ? payload : JSON.stringify(payload);
      try {
        if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
          window.chrome.webview.postMessage(s);
          return;
        }
      } catch (_) {}
      try {
        if (window.PianoFlowHost && window.PianoFlowHost.postMessage) {
          window.PianoFlowHost.postMessage(s);
        }
      } catch (_) {}
    }

    window.pfReady = function () {
      return !!(toolkit && typeof verovio !== 'undefined');
    };

    window.pfToolkitReady = function () {
      return !!toolkit;
    };

    function ensureToolkit() {
      if (toolkit) return true;
      if (typeof verovio === 'undefined' || !verovio.toolkit) return false;
      try {
        toolkit = new verovio.toolkit();
        setStatus('谱面引擎就绪');
        postToHost({ type: 'ready' });
        if (pendingLoad) {
          const p = pendingLoad;
          pendingLoad = null;
          pfLoadFromUrlAsync(p.url, p.options);
        }
        return true;
      } catch (e) {
        setStatus('谱面引擎初始化失败: ' + e);
        logHost('ensureToolkit fail ' + e);
        return false;
      }
    }

    function logHost(msg) {
      try { console.log('[PianoFlow]', msg); } catch (_) {}
      // Only bridge failures to Flutter — success chatter flooded the console.
      var s = String(msg || '');
      var low = s.toLowerCase();
      var important =
        low.indexOf('fail') >= 0 ||
        low.indexOf('error') >= 0 ||
        low.indexOf('exception') >= 0 ||
        low.indexOf('empty') >= 0 ||
        s.indexOf('失败') >= 0 ||
        s.indexOf('为空') >= 0 ||
        s.indexOf('缺少') >= 0;
      if (!important) return;
      postToHost(s);
    }

    function setStatus(t) {
      const el = document.getElementById('status');
      if (el) el.textContent = t || '';
      if (t) logHost('status: ' + t);
    }

    /** Reset visual scroll before measuring note X in content space. */
    function resetScrollTransform() {
      scrollX = 0;
      applyScrollTransform(0);
      const wrap = document.getElementById('wrap');
      if (wrap) wrap.scrollLeft = 0;
    }

    /** Content X (wrap space) — prefer notehead left edge (playhead sits on attack). */
    function elementContentX(id) {
      const el = document.getElementById(id);
      if (!el) return null;
      const wrap = document.getElementById('wrap');
      if (!wrap) return null;
      const head = el.querySelector('.notehead') || el;
      const box = head.getBoundingClientRect();
      if (!(box.width > 0 || box.height > 0)) return null;
      const wbox = wrap.getBoundingClientRect();
      // Subtract center pad so beat→X stays in strip-local space.
      return scrollX + (box.left - wbox.left) - contentCenterPadX;
    }

    /** Leftmost engraved note — independent of timemap id resolution. */
    function leftmostNoteContentX() {
      const wrap = document.getElementById('wrap');
      if (!wrap) return null;
      const wbox = wrap.getBoundingClientRect();
      const nodes = document.querySelectorAll('#svg g.note .notehead, #svg g.note');
      let best = null;
      for (let i = 0; i < nodes.length; i++) {
        const box = nodes[i].getBoundingClientRect();
        if (!(box.width > 0 || box.height > 0)) continue;
        const x = scrollX + (box.left - wbox.left) - contentCenterPadX;
        if (best == null || x < best) best = x;
      }
      return best;
    }

    /** First measure left barline area (fallback when no notes yet). */
    function firstMeasureContentX() {
      const wrap = document.getElementById('wrap');
      const meas = document.querySelector('#svg g.measure');
      if (!wrap || !meas) return null;
      const box = meas.getBoundingClientRect();
      const wbox = wrap.getBoundingClientRect();
      if (!(box.width > 0 || box.height > 0)) return null;
      return scrollX + (box.left - wbox.left) - contentCenterPadX;
    }

    /** Right edge of the last engraved measure (五线谱最右). */
    function lastMeasureContentRightX() {
      const wrap = document.getElementById('wrap');
      if (!wrap) return null;
      const wbox = wrap.getBoundingClientRect();
      const measures = document.querySelectorAll('#svg g.measure');
      let best = null;
      for (let i = 0; i < measures.length; i++) {
        const box = measures[i].getBoundingClientRect();
        if (!(box.width > 0 || box.height > 0)) continue;
        const right = scrollX + (box.right - wbox.left) - contentCenterPadX;
        if (best == null || right > best) best = right;
      }
      if (best != null && isFinite(best)) return best;
      const host = document.getElementById('svg');
      if (!host) return null;
      let contentW = 0;
      rootPageSvgs(host).forEach((pageSvg) => {
        const cssW = parseFloat(pageSvg.style.width);
        if (cssW > 0) contentW += cssW;
        else {
          try {
            const vb = pageSvg.viewBox && pageSvg.viewBox.baseVal;
            if (vb && vb.width > 0) contentW += vb.width;
          } catch (_) { /* ignore */ }
        }
      });
      return contentW > 0 ? contentW : null;
    }

    /** Ensure beat 0 maps to the true start (not a late first-resolved onset). */
    function seedStartBeatX() {
      const startX = leftmostNoteContentX();
      const measX = firstMeasureContentX();
      firstNoteX = (startX != null && isFinite(startX)) ? startX : null;
      startLeadFloorX = (measX != null && isFinite(measX)) ? Math.max(0, measX) : 0;
      const fallback = startX != null ? startX : measX;
      if (fallback == null || !isFinite(fallback)) return;
      if (!beatXPoints.length) {
        beatXPoints.push({ q: 0, x: fallback });
        return;
      }
      if (beatXPoints[0].q > 1e-6) {
        beatXPoints.unshift({ q: 0, x: fallback });
        return;
      }
      // Timemap first hit too far right (wrong id / pre-layout) → snap to leftmost note.
      if (beatXPoints[0].x > fallback + 24) {
        beatXPoints[0].x = fallback;
      } else {
        beatXPoints[0].x = Math.min(beatXPoints[0].x, fallback);
      }
    }

    /**
     * After the last note onset, keep traveling to the staff's right edge so the
     * playhead does not freeze on the final notehead (曲终到五线谱最右).
     */
    function seedEndBeatX() {
      const endXRaw = lastMeasureContentRightX();
      if (endXRaw == null || !isFinite(endXRaw)) {
        scoreEndX = null;
        return;
      }
      // Slight inset so the line sits on the closing barline area.
      const endX = Math.max(0, endXRaw - 6);
      scoreEndX = endX;
      if (!beatXPoints.length) {
        beatXPoints.push({ q: 0, x: endX });
        return;
      }
      const last = beatXPoints[beatXPoints.length - 1];
      let endQ = last.q;
      for (let i = 0; i < timemap.length; i++) {
        const q = timemap[i].qstamp;
        if (typeof q === 'number' && q > endQ) endQ = q;
      }
      // Always leave a short post-onset span so X can ease past the last note.
      endQ = Math.max(endQ, last.q + 0.75);
      if (endX <= last.x + 2) {
        // Last note already near measure end — still nudge past the notehead.
        const nudged = last.x + Math.max(24, (endXRaw - last.x) * 0.85);
        beatXPoints.push({ q: endQ, x: Math.max(endX, nudged) });
        scoreEndX = Math.max(endX, nudged);
        return;
      }
      if (Math.abs(last.q - endQ) < 1e-6) {
        last.x = Math.max(last.x, endX);
        return;
      }
      beatXPoints.push({ q: endQ, x: endX });
    }

    /**
     * Near / before the first onset: park the playhead at the engraved LEFT
     * (measure / staff start — 最左侧), then ease toward the first notehead so
     * the line meets the attack when it should sound. Late-onset pieces use
     * first timemap q (not always 0).
     */
    function focusContentX(beats, noteX) {
      if (noteX == null || !isFinite(noteX)) return noteX;
      const firstQ = (typeof firstSoundingQ === 'number' && isFinite(firstSoundingQ))
        ? firstSoundingQ
        : (beatXPoints.length ? beatXPoints[0].q : 0);
      const base = (firstNoteX != null && isFinite(firstNoteX)) ? firstNoteX : noteX;
      const left = Math.max(0, (startLeadFloorX != null && isFinite(startLeadFloorX))
        ? startLeadFloorX
        : 0);
      const park = firstQ - PLAYBACK_LEAD_IN_BEATS;
      // Before first onset: ease leftmost → first notehead (t=0 = 最左侧).
      if (beats < firstQ - 1e-9) {
        const span = PLAYBACK_LEAD_IN_BEATS > 0 ? PLAYBACK_LEAD_IN_BEATS : 1;
        const t = Math.max(0, Math.min(1, (beats - park) / span));
        if (!(base > left)) return left;
        return left + (base - left) * t;
      }
      return noteX;
    }

    /** Build onset polyline after SVG is in the DOM (transform/scroll at 0). */
    function rebuildBeatXPoints() {
      beatXPoints = [];
      resetScrollTransform();
      for (let i = 0; i < timemap.length; i++) {
        const e = timemap[i];
        if (typeof e.qstamp !== 'number') continue;
        // Note onsets only — ignore measureOn/restOn; offs caused X to stick then jump.
        const ids = e.on || [];
        if (!ids.length) continue;
        let x = null;
        for (let j = 0; j < ids.length; j++) {
          x = elementContentX(ids[j]);
          if (x != null) break;
        }
        if (x == null) continue;
        const last = beatXPoints.length ? beatXPoints[beatXPoints.length - 1] : null;
        if (last && Math.abs(last.q - e.qstamp) < 1e-9) {
          // Same qstamp: keep the leftmost onset (chords / staff pairs).
          last.x = Math.min(last.x, x);
          continue;
        }
        if (last) {
          // True engraved X only — do not inflate px/beat (that desyncs playhead
          // from sounding noteheads vs waterfall/audio). Fix measure glitches only.
          if (x + 8 < last.x) {
            const dq = Math.max(1e-3, e.qstamp - last.q);
            x = last.x + Math.max(1, dq * 2);
          } else if (x < last.x) {
            x = last.x;
          }
        }
        beatXPoints.push({ q: e.qstamp, x: x });
      }
      firstSoundingQ = beatXPoints.length ? beatXPoints[0].q : 0;
      seedStartBeatX();
      seedEndBeatX();
    }

    /** Wait for WebView layout after SVG inject before measuring note X. */
    function afterLayout(fn) {
      requestAnimationFrame(() => {
        requestAnimationFrame(fn);
      });
    }

    /**
     * Notehead polyline X — where the sounding note is engraved.
     * Playhead must use this so audio and staff stay aligned.
     */
    function noteContentXAtBeats(beats) {
      if (!beatXPoints.length) {
        const svg = document.querySelector('#svg svg');
        if (!svg || !timemap.length) return null;
        const totalBeats = timemap[timemap.length - 1].qstamp || 0;
        let w = 0;
        const cssW = svg.style && parseFloat(svg.style.width);
        if (cssW > 0) w = cssW;
        else w = svg.getBoundingClientRect().width;
        if (totalBeats <= 0 || w <= 0) return null;
        return (beats / totalBeats) * w;
      }
      if (beats <= beatXPoints[0].q + 1e-9) return beatXPoints[0].x;
      const last = beatXPoints[beatXPoints.length - 1];
      // Last polyline point is the staff-end sentinel (seedEndBeatX).
      if (beats >= last.q - 1e-9) return last.x;
      for (let i = 1; i < beatXPoints.length; i++) {
        const a = beatXPoints[i - 1];
        const b = beatXPoints[i];
        if (beats <= b.q + 1e-9) {
          const span = b.q - a.q;
          const t = span > 1e-9 ? (beats - a.q) / span : 0;
          return a.x + (b.x - a.x) * Math.max(0, Math.min(1, t));
        }
      }
      return last.x;
    }

    /** Same Dart beats → engraved onset X (lead-in only before beat 0). */
    function transportContentXAtBeats(beats) {
      const noteX = noteContentXAtBeats(beats);
      if (noteX == null || !isFinite(noteX)) return null;
      return focusContentX(beats, noteX);
    }

    function maxScrollX(wrap) {
      const host = document.getElementById('svg');
      if (!host) return Math.max(0, wrap.scrollWidth - wrap.clientWidth);
      // Prefer explicit CSS widths from sizeEngravingFixedScale — WebView2
      // scrollWidth/getBoundingClientRect can under-report after height clamps,
      // which made maxS≈0 and froze horizontal scroll ("五线谱不动").
      let contentW = 0;
      rootPageSvgs(host).forEach((pageSvg) => {
        const cssW = parseFloat(pageSvg.style.width);
        if (cssW > 0) {
          contentW += cssW;
          return;
        }
        try {
          const vb = pageSvg.viewBox && pageSvg.viewBox.baseVal;
          if (vb && vb.width > 0) {
            contentW += vb.width;
            return;
          }
        } catch (_) { /* ignore */ }
        const sw = pageSvg.getBoundingClientRect().width;
        if (sw > 0) contentW += sw;
      });
      if (!(contentW > 0)) {
        contentW = host.scrollWidth || 0;
        const svg = host.querySelector('svg');
        if (svg) {
          const sw = svg.getBoundingClientRect().width;
          if (sw > contentW) contentW = sw;
        }
      }
      return Math.max(0, contentW - wrap.clientWidth);
    }

    /**
     * Playhead is a viewport overlay (#stage). Convert content X → view X.
     * Scroll keeps the strip left until focus X reaches ANCHOR; then the orange
     * line locks there and the score slides underneath.
     */
    function paintPlayhead(ph, contentX, sx) {
      ph.style.display = 'block';
      ph.style.height = '100%';
      // Keep ~12px at full scale; shrink with strip fit so a fat bar never
      // dwarfs noteheads after the staff lane resizes (16px was too thick).
      const fit = (typeof window.__pfStripFit === 'number' && window.__pfStripFit > 0)
        ? window.__pfStripFit
        : 1;
      const barW = Math.max(5, Math.min(12, Math.round(12 * Math.min(1, fit))));
      ph.style.width = barW + 'px';
      ph.style.maxWidth = barW + 'px';
      ph.style.minWidth = barW + 'px';
      ph.style.transform = 'none';
      const halfW = barW / 2;
      // contentX is strip-local; add center pad for wide-lane idle layout.
      const viewX = (contentX - sx + contentCenterPadX) - halfW;
      ph.style.left = viewX + 'px';
    }

    /**
     * Opening: scroll stays 0 so the playhead walks from the left toward
     * ANCHOR. Mid-piece: lock the line at ANCHOR and scroll the strip.
     *
     * Do not ease a smaller start-anchor into ANCHOR — that briefly asks for
     * scroll>0 then clamps back to 0, and the whole staff jumps right once
     * when playback starts.
     */
    function scrollTargetForFocusX(focusX, viewW, maxS) {
      const anchorX = viewW * ANCHOR;
      if (!(viewW > 0) || !(focusX > anchorX)) return 0;
      return Math.max(0, Math.min(maxS, focusX - anchorX));
    }

    function applyScrollTransform(sx) {
      scrollX = sx;
      const host = document.getElementById('svg');
      if (host) {
        const x = contentCenterPadX - sx;
        host.style.transform = 'translate3d(' + x + 'px, 0, 0)';
      }
    }

    /**
     * Idle / wide-lane placement: center the engraved strip horizontally when
     * narrower than the viewport. Always top-align vertically — centering in a
     * taller lane creates large cream margins above/below the staff while the
     * Flutter stage still looks staff-heavy. Follow-scroll unchanged.
     */
    function placeEngravingInLane(host) {
      const wrap = document.getElementById('wrap');
      if (!host || !wrap) return;
      const laneW = wrap.clientWidth || 0;
      const laneH = wrap.clientHeight || 0;
      let contentW = 0;
      let contentH = 0;
      rootPageSvgs(host).forEach((pageSvg) => {
        const w = parseFloat(pageSvg.style.width);
        const h = parseFloat(pageSvg.style.height);
        if (w > 0) contentW += w;
        else {
          try {
            const r = pageSvg.getBoundingClientRect();
            if (r.width > 0) contentW += r.width;
          } catch (_) { /* ignore */ }
        }
        if (h > contentH) contentH = h;
      });
      if (!(contentW > 0)) {
        contentW = host.scrollWidth || 0;
      }
      if (!(contentH > 0)) {
        try {
          contentH = host.getBoundingClientRect().height || 0;
        } catch (_) { contentH = 0; }
      }
      // Top-align always (bass ledger safety + no floating-in-tall-box look).
      host.style.alignItems = 'flex-start';
      contentCenterPadX = (laneW > 0 && contentW > 0 && contentW < laneW - 0.5)
        ? Math.floor((laneW - contentW) / 2)
        : 0;
      if (contentCenterPadX > 0 || (laneH > 0 && contentH > 0 && laneH - contentH > 12)) {
        logHost(
          'placeEngraving padX=' + contentCenterPadX +
          ' contentW=' + Math.round(contentW) + ' laneW=' + Math.round(laneW) +
          ' contentH=' + Math.round(contentH) + ' laneH=' + Math.round(laneH),
        );
      }
      applyScrollTransform(scrollX);
    }

    /** Ease ≤ MAX_EXTRAPOLATE_SEC after last Dart beat — never a second clock. */
    function currentDisplayBeats(now) {
      if (!(beatsPerSec > 0) || !(lastSyncTime > 0)) return lastBeats;
      const age = Math.max(0, (now - lastSyncTime) / 1000);
      const t = Math.min(age, MAX_EXTRAPOLATE_SEC);
      return lastBeats + t * beatsPerSec;
    }

    function transportLive(now) {
      if (!(beatsPerSec > 0) || !(lastSyncTime > 0)) return false;
      return (now - lastSyncTime) < DART_LIVE_MS;
    }

    function shouldKeepScrollRaf(now, catchingUp) {
      return catchingUp || transportLive(now) || now < liveUntil;
    }

    function tickSmoothScroll(nowTs) {
      scrollRaf = null;
      const wrap = document.getElementById('wrap');
      const ph = document.getElementById('playhead');
      if (!wrap || !ph) return;

      const now = (typeof nowTs === 'number') ? nowTs : performance.now();
      displayBeats = currentDisplayBeats(now);
      const focusX = transportContentXAtBeats(displayBeats);
      if (focusX == null || !isFinite(focusX)) {
        ph.style.display = 'none';
        if (shouldKeepScrollRaf(now, false)) {
          scrollRaf = requestAnimationFrame(tickSmoothScroll);
        }
        return;
      }
      targetContentX = focusX;

      const maxS = maxScrollX(wrap);
      const targetScroll = scrollTargetForFocusX(focusX, wrap.clientWidth, maxS);
      const dist = targetScroll - scrollX;
      // Playing: hard-track Dart beats. Paused: soft ease / snap on seek.
      const hard = forceSnap || beatsPerSec > 0 ||
        Math.abs(dist) > DRIFT_SNAP_PX ||
        Math.abs(dist) > wrap.clientWidth * 0.35;

      let next;
      if (hard || Math.abs(dist) < 0.15) {
        next = targetScroll;
        forceSnap = false;
      } else {
        next = scrollX + dist * SCROLL_CATCHUP;
        if (Math.abs(targetScroll - next) < 0.15) next = targetScroll;
      }
      applyScrollTransform(next);
      paintPlayhead(ph, focusX, scrollX);

      const catchingUp = Math.abs(scrollX - targetScroll) >= 0.15;
      if (shouldKeepScrollRaf(now, catchingUp)) {
        scrollRaf = requestAnimationFrame(tickSmoothScroll);
      }
    }

    function startSmoothScroll(snap) {
      if (snap) forceSnap = true;
      const pad = beatsPerSec > 0 ? (DART_LIVE_MS + 80) : 120;
      liveUntil = performance.now() + pad;
      if (scrollRaf == null) {
        scrollRaf = requestAnimationFrame(tickSmoothScroll);
      }
    }

    /** Drive playhead + horizontal scroll from continuous beat X. */
    function updatePlayhead(beats, snap) {
      const wrap = document.getElementById('wrap');
      const ph = document.getElementById('playhead');
      if (!wrap || !ph) return;

      displayBeats = beats;
      const focusX = transportContentXAtBeats(beats);
      if (focusX == null || !isFinite(focusX)) {
        ph.style.display = 'none';
        startSmoothScroll(!!snap);
        return;
      }
      targetContentX = focusX;
      startSmoothScroll(!!snap);
    }

    function countMeasures(musicXml) {
      const m = musicXml.match(/<measure\b/gi);
      return m ? m.length : 8;
    }

    /**
     * Hide instrument / part names ("Piano") so Verovio does not reserve
     * left margin for labels. Toolkit has no label:false option.
     */
    function stripPartLabels(musicXml) {
      if (!musicXml) return musicXml;
      function forcePrintNo(tag, xml) {
        const re = new RegExp('<' + tag + '(\\s[^>]*)?>', 'gi');
        return xml.replace(re, (open) => {
          if (/print-object\s*=/i.test(open)) {
            return open.replace(/print-object\s*=\s*["'][^"']*["']/i, 'print-object="no"');
          }
          return open.replace(new RegExp('<' + tag, 'i'), '<' + tag + ' print-object="no"');
        });
      }
      let out = musicXml;
      out = forcePrintNo('part-name', out);
      out = forcePrintNo('part-abbreviation', out);
      out = forcePrintNo('group-name', out);
      out = forcePrintNo('group-abbreviation', out);
      // Remove full <print>…</print> blocks (and self-closing). Only stripping the
      // open tag leaves orphan </print> + system-layout and Verovio engraves empty.
      out = out.replace(/<print\b[^>]*\/>/gi, '');
      out = out.replace(/<print\b[^>]*>[\s\S]*?<\/print>/gi, '');
      return out;
    }

    /* pf-equal-start */
    /**
     * Pure helpers for equal barline spacing. Practice strip keeps one system;
     * these remap engraved X so every measure has the same width. DOM glue is
     * equalizeMeasureWidths. Node tests eval this block.
     */
    function fmtNum(n) {
      if (!isFinite(n)) return '0';
      const r = Math.round(n * 100) / 100;
      if (Object.is(r, -0)) return '0';
      return String(r);
    }

    /**
     * spans: [{left, right}] in one system, left-to-right, typically abutting.
     * Total ink width is preserved (last right edge stays) so scroll length and
     * the playhead's end anchor do not grow.
     */
    function buildEqualMap(spans) {
      const origin = spans[0].left;
      let total = 0;
      const slots = [];
      for (let i = 0; i < spans.length; i++) {
        const sp = spans[i];
        const oldW = sp.right - sp.left;
        total += oldW;
        slots.push({ left: sp.left, right: sp.right, oldW: oldW });
      }
      const target = total / spans.length;
      for (let i = 0; i < slots.length; i++) {
        slots[i].newLeft = origin + i * target;
        slots[i].newRight = origin + (i + 1) * target;
      }
      function slotIndex(x) {
        if (x < slots[0].left) return 0;
        for (let i = 0; i < slots.length; i++) {
          if (i === slots.length - 1 || x < slots[i].right) return i;
        }
        return slots.length - 1;
      }
      function mapX(x) {
        if (!isFinite(x)) return x;
        if (x <= slots[0].left) return slots[0].newLeft + (x - slots[0].left);
        const i = slotIndex(x);
        const s = slots[i];
        const t = s.oldW > 0 ? (x - s.left) / s.oldW : 0;
        return s.newLeft + t * target;
      }
      function sxAt(x) {
        const s = slots[slotIndex(x)];
        return s.oldW > 0 ? target / s.oldW : 1;
      }
      return { target: target, mapX: mapX, sxAt: sxAt, slots: slots };
    }

    function remapPathD(d, mapX) {
      const tokens = d.match(/[A-Za-z]|-?(?:\d+\.?\d*|\.\d+)/g);
      if (!tokens) return d;
      let i = 0;
      let cmd = '';
      const out = [];
      function nextNum() {
        return tokens[i++];
      }
      while (i < tokens.length) {
        if (/[A-Za-z]/.test(tokens[i])) {
          cmd = tokens[i++];
          out.push(cmd);
          if (cmd === 'Z' || cmd === 'z') continue;
        }
        const abs = cmd === cmd.toUpperCase();
        const c = cmd.toUpperCase();
        if (c === 'H') {
          const x = parseFloat(nextNum());
          out.push(abs ? fmtNum(mapX(x)) : fmtNum(x));
          continue;
        }
        if (c === 'V') {
          out.push(nextNum());
          continue;
        }
        let pairs = 1;
        if (c === 'C') pairs = 3;
        else if (c === 'S' || c === 'Q') pairs = 2;
        for (let k = 0; k < pairs; k++) {
          const x = parseFloat(nextNum());
          const y = nextNum();
          out.push(abs ? fmtNum(mapX(x)) : fmtNum(x));
          out.push(y);
        }
      }
      return out.join(' ');
    }

    function remapPoints(points, mapX) {
      return points.trim().split(/\s+/).map((pair) => {
        const bits = pair.split(',');
        if (bits.length < 2) return pair;
        const x = parseFloat(bits[0]);
        if (!isFinite(x)) return pair;
        bits[0] = fmtNum(mapX(x));
        return bits.join(',');
      }).join(' ');
    }

    /** Move a Verovio <use> and scale it on X so squeezed bars do not overlap. */
    function remapTranslateScale(transform, mapX, sx) {
      let out = transform.replace(
        /translate\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/,
        (_, x, y) => 'translate(' + fmtNum(mapX(parseFloat(x))) + ', ' + y + ')',
      );
      if (isFinite(sx) && Math.abs(sx - 1) > 1e-4) {
        out = out.replace(
          /scale\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/,
          (_, a, b) => 'scale(' + fmtNum(parseFloat(a) * sx) + ', ' + b + ')',
        );
      }
      return out;
    }
    /* pf-equal-end */

    /**
     * Verovio spaces by duration plus clef / meter / tempo inside the bar
     * (spacingNonLinear does not force equal barlines). After engraving, remap
     * every absolute X in each system so barline-to-barline width is identical.
     * Glyphs scale on X with their bar. The playhead is measured afterwards
     * from noteheads, so it stays on the attack.
     */
    function equalizeMeasureWidths(host) {
      if (!host) return;
      const systems = host.querySelectorAll('g.system');
      systems.forEach((system) => {
        const measures = Array.from(system.children).filter((el) => {
          const c = el.getAttribute && el.getAttribute('class');
          return c && c.split(/\s+/).indexOf('measure') >= 0;
        });
        if (measures.length < 2) return;
        const spans = [];
        for (let i = 0; i < measures.length; i++) {
          const sp = measureStaffSpan(measures[i]);
          if (!sp) {
            logHost('equal bars skip: measure without staff span');
            return;
          }
          spans.push(sp);
        }
        let minW = Infinity;
        let maxW = 0;
        for (let i = 0; i < spans.length; i++) {
          const w = spans[i].right - spans[i].left;
          if (w < minW) minW = w;
          if (w > maxW) maxW = w;
        }
        if (maxW > minW + 0.5) {
          const built = buildEqualMap(spans);
          const mapX = built.mapX;
          const nodes = system.querySelectorAll('*');
          for (let n = 0; n < nodes.length; n++) {
            const el = nodes[n];
            if (equalizeSkip(el, system)) continue;
            const tag = (el.tagName || '').toLowerCase();
            if (tag === 'rect') {
              const x = parseFloat(el.getAttribute('x'));
              const w = parseFloat(el.getAttribute('width'));
              if (isFinite(x)) {
                el.setAttribute('x', fmtNum(mapX(x)));
                if (isFinite(w)) {
                  el.setAttribute('width', fmtNum(mapX(x + w) - mapX(x)));
                }
              }
            } else if (tag !== 'svg' && el.hasAttribute('x')) {
              const x = parseFloat(el.getAttribute('x'));
              if (isFinite(x)) el.setAttribute('x', fmtNum(mapX(x)));
            }
            if (el.hasAttribute('points')) {
              el.setAttribute('points', remapPoints(el.getAttribute('points'), mapX));
            }
            if (tag === 'path' && el.hasAttribute('d')) {
              el.setAttribute('d', remapPathD(el.getAttribute('d'), mapX));
            }
            if (el.hasAttribute('transform') && el.getAttribute('transform').indexOf('translate') >= 0) {
              const tr = el.getAttribute('transform');
              const mx = /translate\(\s*(-?[\d.]+)/.exec(tr);
              const x0 = mx ? parseFloat(mx[1]) : NaN;
              const sx = isFinite(x0) ? built.sxAt(x0) : 1;
              el.setAttribute('transform', remapTranslateScale(tr, mapX, sx));
            }
          }
          logHost(
            'equal bars n=' + spans.length +
            ' target=' + Math.round(built.target) +
            ' was=' + Math.round(minW) + '-' + Math.round(maxW),
          );
        }
        // Staff ends are now one width. Closing barlines sit a few units inside
        // that end (more on repeats), so snap only the rightmost stroke onto it.
        snapClosingBarlines(system, measures);
      });
    }

    /** X of a vertical path, or null. */
    function verticalPathX(pathEl) {
      const d = (pathEl && pathEl.getAttribute && pathEl.getAttribute('d')) || '';
      const m = d.match(/M\s*(-?[\d.]+)\s+(-?[\d.]+)\s+L\s*(-?[\d.]+)\s+(-?[\d.]+)/i);
      if (!m) return null;
      const x1 = parseFloat(m[1]);
      const y1 = parseFloat(m[2]);
      const x2 = parseFloat(m[3]);
      const y2 = parseFloat(m[4]);
      if (!isFinite(x1) || Math.abs(x1 - x2) > 1.5) return null;
      if (Math.abs(y1 - y2) < 40) return null;
      return x1;
    }

    function setVerticalPathX(pathEl, x) {
      const d = pathEl.getAttribute('d') || '';
      const next = d.replace(
        /M\s*(-?[\d.]+)(\s+)(-?[\d.]+)(\s+)L\s*(-?[\d.]+)(\s+)(-?[\d.]+)/i,
        'M' + fmtNum(x) + '$2$3$4L' + fmtNum(x) + '$6$7',
      );
      if (next !== d) pathEl.setAttribute('d', next);
    }

    function shiftTranslateX(el, dx) {
      const tr = el.getAttribute('transform') || '';
      if (tr.indexOf('translate') < 0) {
        el.setAttribute('transform', ('translate(' + fmtNum(dx) + ',0) ' + tr).trim());
        return;
      }
      el.setAttribute(
        'transform',
        tr.replace(
          /translate\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/,
          (_, x, y) => 'translate(' + fmtNum(parseFloat(x) + dx) + ', ' + y + ')',
        ),
      );
    }

    /**
     * Staff lines are one width after the remap. Move each measure's barline
     * group onto that edge without collapsing a double bar or a repeat:
     * a group on the right lands on the staff end, a group on the left
     * (opening repeat) lands on the staff start.
     */
    function snapClosingBarlines(system, measures) {
      if (!system || !measures || !measures.length) return;
      const first = measureStaffSpan(measures[0]);
      if (first) {
        const kids = system.children || [];
        for (let i = 0; i < kids.length; i++) {
          const el = kids[i];
          if ((el.tagName || '').toLowerCase() !== 'path') continue;
          if (verticalPathX(el) == null) continue;
          setVerticalPathX(el, first.left);
          break;
        }
      }
      for (let i = 0; i < measures.length; i++) {
        const sp = measureStaffSpan(measures[i]);
        if (!sp) continue;
        const groups = measures[i].querySelectorAll('g.barLine');
        const verts = [];
        for (let g = 0; g < groups.length; g++) {
          const paths = groups[g].querySelectorAll('path');
          for (let k = 0; k < paths.length; k++) {
            const x = verticalPathX(paths[k]);
            if (x == null) continue;
            verts.push({ el: paths[k], x: x, group: groups[g] });
          }
        }
        if (!verts.length) continue;
        let minX = verts[0].x;
        let maxX = verts[0].x;
        for (let k = 1; k < verts.length; k++) {
          if (verts[k].x < minX) minX = verts[k].x;
          if (verts[k].x > maxX) maxX = verts[k].x;
        }
        const mid = (sp.left + sp.right) / 2;
        const dx = maxX >= mid ? sp.right - maxX : sp.left - minX;
        if (Math.abs(dx) < 0.5) continue;
        const touched = [];
        for (let k = 0; k < verts.length; k++) {
          setVerticalPathX(verts[k].el, verts[k].x + dx);
          if (touched.indexOf(verts[k].group) < 0) touched.push(verts[k].group);
        }
        for (let g = 0; g < touched.length; g++) {
          const dots = touched[g].querySelectorAll('use');
          for (let u = 0; u < dots.length; u++) shiftTranslateX(dots[u], dx);
        }
      }
    }

    function equalizeSkip(el, system) {
      let p = el;
      while (p && p !== system) {
        const c = p.getAttribute && p.getAttribute('class');
        if (c) {
          const parts = c.split(/\s+/);
          if (parts.indexOf('grpSym') >= 0 || parts.indexOf('label') >= 0 || parts.indexOf('labelAbbr') >= 0) {
            return true;
          }
        }
        p = p.parentNode;
      }
      return false;
    }

    function inLedgerLines(el) {
      let p = el;
      while (p) {
        const c = p.getAttribute && p.getAttribute('class');
        if (c && c.split(/\s+/).indexOf('ledgerLines') >= 0) return true;
        p = p.parentNode;
      }
      return false;
    }

    /** Horizontal staff-line extent of one measure (the long staff strokes). */
    function measureStaffSpan(meas) {
      let left = Infinity;
      let right = -Infinity;
      let longest = 0;
      const segs = [];
      function considerHorizontal(x1, y1, x2, y2) {
        if (Math.abs(y1 - y2) > 1.5) return;
        const lo = Math.min(x1, x2);
        const hi = Math.max(x1, x2);
        const w = hi - lo;
        if (w > longest) longest = w;
        segs.push({ lo: lo, hi: hi, w: w });
      }
      const staffs = meas.querySelectorAll('g.staff');
      for (let s = 0; s < staffs.length; s++) {
        const paths = staffs[s].querySelectorAll('path');
        for (let k = 0; k < paths.length; k++) {
          if (inLedgerLines(paths[k])) continue;
          const d = paths[k].getAttribute('d') || '';
          const tokens = d.match(/[A-Za-z]|-?(?:\d+\.?\d*|\.\d+)/g);
          if (!tokens) continue;
          let i = 0;
          let cmd = '';
          let cx = 0;
          let cy = 0;
          function num() {
            return parseFloat(tokens[i++]);
          }
          while (i < tokens.length) {
            if (/[A-Za-z]/.test(tokens[i])) cmd = tokens[i++];
            if (!cmd) break;
            const abs = cmd === cmd.toUpperCase();
            const c = cmd.toUpperCase();
            if (c === 'Z') continue;
            if (c === 'M' || c === 'L') {
              const x = num();
              const y = num();
              const nx = abs ? x : cx + x;
              const ny = abs ? y : cy + y;
              if (c === 'L') considerHorizontal(cx, cy, nx, ny);
              cx = nx;
              cy = ny;
            } else if (c === 'H') {
              const x = num();
              const nx = abs ? x : cx + x;
              considerHorizontal(cx, cy, nx, cy);
              cx = nx;
            } else if (c === 'V') {
              const y = num();
              cy = abs ? y : cy + y;
            } else {
              break;
            }
          }
        }
      }
      const minLen = Math.max(40, longest * 0.55);
      for (let i = 0; i < segs.length; i++) {
        if (segs[i].w < minLen) continue;
        if (segs[i].lo < left) left = segs[i].lo;
        if (segs[i].hi > right) right = segs[i].hi;
      }
      if (!(right > left)) return null;
      return { left: left, right: right };
    }

    /**
     * Verovio places .mnum at the left barline; shift to measure center.
     * Hide measure ≤1 (pickup / first bar) — mnumInterval:1 otherwise shows them.
     * Also hide mnum on the first measure node as a DOM-order fallback.
     */
    function polishMeasureNumbers(host) {
      if (!host) return;
      const measures = host.querySelectorAll('g.measure');
      measures.forEach((meas, index) => {
        const mnum = meas.querySelector('g.mnum');
        if (!mnum) return;
        const text = (mnum.textContent || '').replace(/\s+/g, '').trim();
        const n = parseInt(text, 10);
        const hideByNumber = Number.isFinite(n) && n <= 1;
        if (hideByNumber || index === 0) {
          mnum.style.display = 'none';
          return;
        }
        try {
          const mb = meas.getBBox();
          const nb = mnum.getBBox();
          if (!(mb.width > 0) || !(nb.width >= 0)) return;
          const targetX = mb.x + mb.width / 2;
          const currentCenterX = nb.x + nb.width / 2;
          const dx = targetX - currentCenterX;
          if (Math.abs(dx) < 0.5) return;
          const prev = mnum.getAttribute('transform') || '';
          mnum.setAttribute('transform', ('translate(' + dx + ',0) ' + prev).trim());
        } catch (_) { /* getBBox can fail on detached/hidden */ }
      });
    }

    /** Phone / narrow staff lane — readable notes, horizontal follow scroll only. */
    function isNarrowLane(cssW, cssH) {
      const w = cssW || 0;
      // Width only. A short desktop staff lane must not flip into the phone
      // page-width formula (that reflows bars). Height is the visual hug.
      return w > 0 && w < 520;
    }

    /** Fit Verovio page metrics to the WebView box (units: 1/10 mm). */
    function layoutOptions(options, musicXml) {
      const wrap = document.getElementById('wrap');
      const cssW = (options && options.cssWidth) || wrap.clientWidth || window.innerWidth || 800;
      const cssH = (options && options.cssHeight) || wrap.clientHeight || window.innerHeight || 220;
      const measures = countMeasures(musicXml || '');
      const mode = (options && options.layoutMode) === 'paged' ? 'paged' : 'strip';
      const narrow = !!((options && options.mobile) || isNarrowLane(cssW, cssH));
      // Fixed engraver scale across all scores — hosts may pass scale; never
      // derive from lane height / measure count (that made notes uneven).
      const scale = Math.max(40, Math.min(100, (options && options.scale) || 60));
      if (mode === 'paged') {
        // Vertical browse: same engraver scale as practice strip; wrap systems
        // by page height only (spacing/margins match strip in applyToolkitOptions).
        const pageWidth = Math.max(
          1200,
          Math.min(4000, (options && options.pageWidth) || Math.floor(cssW * 100 / scale)),
        );
        const pageHeight = Math.max(
          1600,
          Math.min(
            6000,
            (options && options.pageHeight) || Math.floor(Math.max(cssH, 480) * 100 / scale),
          ),
        );
        return {
          scale: scale,
          pageWidth,
          pageHeight,
          cssW,
          cssH,
          measures,
          rawWidth: pageWidth,
          breaks: 'auto',
          layoutMode: 'paged',
        };
      }
      if (narrow) {
        // One continuous system, wide strip — never crush all measures into viewport width.
        const pageWidth = Math.max(
          6000,
          Math.min(120000, Math.max(measures * 300, Math.floor(cssW * 140 / scale))),
        );
        const pageHeight = Math.max(
          640,
          Math.min(920, (options && options.pageHeight) || 720),
        );
        return {
          scale,
          pageWidth,
          pageHeight,
          cssW,
          cssH,
          measures,
          rawWidth: pageWidth,
          breaks: 'none',
          mobile: true,
          layoutMode: 'strip',
        };
      }
      // Flowkey-like continuous grand staff: ONE horizontal system for the whole
      // piece. Cap-width + breaks:auto used to paginate mid-scroll and redraw the
      // piano brace/clefs on every system — discontinuous middle. Width scales
      // with measure count; adjustPageWidth expands further if ink needs room.
      const pageWidth = Math.max(
        4000,
        Math.min(120000, Math.max(
          Math.floor(cssW * 120 / scale),
          measures * 240,
        )),
      );
      // Tall enough for one piano grand staff only (no vertical wrap).
      const pageHeight = Math.max(
        560,
        Math.min(
          900,
          (options && options.pageHeight) || Math.floor(cssH * 100 / scale) + 80,
        ),
      );
      return {
        scale,
        pageWidth,
        pageHeight,
        cssW,
        cssH,
        measures,
        rawWidth: pageWidth,
        breaks: 'none',
        layoutMode: 'strip',
      };
    }

    function applyToolkitOptions(lay, scale, pageHeight, pageWidth, breaksMode) {
      const breaks = breaksMode || (lay && lay.breaks) || 'none';
      const paged = breaks === 'auto' || (lay && lay.layoutMode === 'paged');
      toolkit.setOptions({
        scale: scale,
        pageWidth: pageWidth,
        pageHeight: pageHeight,
        adjustPageHeight: true,
        // Strip: expand width for one continuous system.
        // Paged browse: keep pageWidth so systems wrap vertically — engraving
        // metrics otherwise match practice strip (same note look).
        adjustPageWidth: !paged,
        breaks: breaks,
        footer: 'none',
        header: 'none',
        svgViewBox: true,
        pageMarginTop: 36,
        pageMarginBottom: 48,
        pageMarginLeft: 48,
        pageMarginRight: 28,
        spacingStaff: 14,
        // Slightly more air between systems when stacked vertically.
        spacingSystem: paged ? 12 : 8,
        spacingLinear: 0.05,
        spacingNonLinear: 1.0,
        noJustification: true,
        unit: 9,
        justifyVertically: false,
        mnumInterval: 1,
      });
    }

    function setBrowseChrome(on) {
      try {
        document.body.classList.toggle('pf-browse', !!on);
      } catch (_) { /* ignore */ }
      const ph = document.getElementById('playhead');
      if (ph && on) ph.style.display = 'none';
    }

    /** Top-level page SVGs only — never nested svg.definition-scale. */
    function rootPageSvgs(host) {
      if (!host) return [];
      return Array.from(host.children).filter(
        (el) => el && el.tagName && el.tagName.toLowerCase() === 'svg',
      );
    }

    /**
     * Verovio nests MEI units in svg.definition-scale. Crop that viewport (or
     * the page root if absent). Never rewrite both — dual viewBoxes caused the
     * first-bar scale jump / staff misalignment.
     */
    function fitViewportSvg(pageSvg) {
      if (!pageSvg) return null;
      return pageSvg.querySelector('svg.definition-scale') || pageSvg;
    }

    /**
     * Vertical span of g.system in the page SVG's user space (viewBox units).
     * Screen rects first; CTM if the element is not laid out yet.
     */
    function systemSpanY(pageSvg) {
      const systems = pageSvg.querySelectorAll('g.system');
      if (!systems.length) return null;
      try {
        const pageBox = pageSvg.getBoundingClientRect();
        if (pageBox && pageBox.height > 1) {
          let top = Infinity;
          let bottom = -Infinity;
          const vb = pageSvg.viewBox.baseVal;
          const scaleY = vb.height / pageBox.height;
          systems.forEach((sys) => {
            const r = sys.getBoundingClientRect();
            if (!(r.height > 0)) return;
            const y0 = (r.top - pageBox.top) * scaleY;
            const y1 = (r.bottom - pageBox.top) * scaleY;
            if (y0 < top) top = y0;
            if (y1 > bottom) bottom = y1;
          });
          if (isFinite(top) && bottom > top) return { top: top, bottom: bottom };
        }
      } catch (_) { /* fall through */ }
      try {
        const pageCTM = pageSvg.getScreenCTM();
        if (!pageCTM) return null;
        const inv = pageCTM.inverse();
        let top = Infinity;
        let bottom = -Infinity;
        systems.forEach((sys) => {
          const b = sys.getBBox();
          const ctm = sys.getScreenCTM();
          if (!ctm || !(b.height > 0)) return;
          const m = inv.multiply(ctm);
          [b.y, b.y + b.height].forEach((y) => {
            [b.x, b.x + b.width].forEach((x) => {
              const pt = pageSvg.createSVGPoint();
              pt.x = x;
              pt.y = y;
              const r = pt.matrixTransform(m);
              if (r.y < top) top = r.y;
              if (r.y > bottom) bottom = r.y;
            });
          });
        });
        if (isFinite(top) && bottom > top) return { top: top, bottom: bottom };
      } catch (_) { /* ignore */ }
      return null;
    }

    /**
     * Strip pages are one grand staff plus a tall Verovio page (margins).
     * Crop vertically to g.system so the lane is the engraved line, not an
     * empty cream page. X / width stay put — measure equalization and the
     * playhead both read horizontal positions.
     *
     * Verovio nests the ink in svg.definition-scale and maps that full
     * definition page into the CSS box. Setting CSS height to the cropped
     * slice while leaving the nested viewBox on the whole page squeezed each
     * score by crop/page — a short page (小星星) shrank, a full page (诀别书)
     * stayed near native. Crop the nested viewBox to the same slice so
     * 1 page unit stays 1 CSS px for every score.
     * Returns the cropped height in page units (1:1 with CSS px), or 0.
     */
    function cropStripViewBoxToSystem(pageSvg) {
      if (!pageSvg || layoutMode === 'paged') return 0;
      const nested = pageSvg.querySelector('svg.definition-scale');
      let full = pageSvg.__pfFullVb;
      if (!full) {
        let vb;
        try { vb = pageSvg.viewBox && pageSvg.viewBox.baseVal; } catch (_) { return 0; }
        if (!vb || !(vb.width > 0) || !(vb.height > 0)) return 0;
        full = { x: vb.x, y: vb.y, w: vb.width, h: vb.height };
        pageSvg.__pfFullVb = full;
      }
      let nv = nested && nested.__pfFullVb;
      if (nested && !nv) {
        let b;
        try { b = nested.viewBox && nested.viewBox.baseVal; } catch (_) { b = null; }
        if (b && b.width > 0 && b.height > 0) {
          nv = { x: b.x, y: b.y, w: b.width, h: b.height };
          nested.__pfFullVb = nv;
        }
      }
      const systems = pageSvg.querySelectorAll('g.system');
      if (!systems.length) return 0;
      // Measure against the full page. A second pass (afterLayout) must not
      // crop an already-cropped viewBox again.
      pageSvg.setAttribute(
        'viewBox',
        full.x + ' ' + full.y + ' ' + full.w + ' ' + full.h,
      );
      pageSvg.style.width = full.w + 'px';
      pageSvg.style.height = full.h + 'px';
      if (nested && nv) {
        nested.setAttribute('viewBox', nv.x + ' ' + nv.y + ' ' + nv.w + ' ' + nv.h);
        nested.removeAttribute('width');
        nested.removeAttribute('height');
        nested.removeAttribute('x');
        nested.removeAttribute('y');
      }
      const span = systemSpanY(pageSvg);
      if (!span) return 0;
      // Extra top pad: high tied notes (诀别书 A5 延音弧) sit above the
      // system ink bbox and were getting clipped by the strip crop.
      const padTop = 28;
      const padBottom = 16;
      let y0 = span.top - padTop;
      let y1 = span.bottom + padBottom;
      if (y0 < full.y) y0 = full.y;
      if (y1 > full.y + full.h) y1 = full.y + full.h;
      const h = y1 - y0;
      if (!(h > 40)) return 0;
      pageSvg.setAttribute('viewBox', full.x + ' ' + y0 + ' ' + full.w + ' ' + h);
      if (nested && nv && full.h > 0) {
        const k = nv.h / full.h;
        const ny = nv.y + (y0 - full.y) * k;
        const nh = h * k;
        nested.setAttribute(
          'viewBox',
          nv.x + ' ' + ny + ' ' + nv.w + ' ' + nh,
        );
        // User units of the cropped outer viewBox, which CSS maps 1:1.
        // Do not use 100% — that collapsed the ink in WebView2.
        nested.setAttribute('x', '0');
        nested.setAttribute('y', '0');
        nested.setAttribute('width', String(full.w));
        nested.setAttribute('height', String(h));
        nested.setAttribute('preserveAspectRatio', 'xMinYMin meet');
      }
      logHost(
        'cropStaff ink=' + Math.round(h) + ' page=' + Math.round(full.h),
      );
      return h;
    }

    /**
     * Size page SVGs for the host lane.
     * Engraver scale is fixed (hosts pass scale=60). Cropping keeps 1 page
     * unit = 1 CSS px, so a short score is not squeezed smaller than 诀别书.
     * Strip height is the cropped system, not the page viewBox.
     * If that line is still taller than the lane, shrink ALL pages by the same
     * fit so the bass staff is not clipped — never crop the ink.
     */
    function sizeEngravingFixedScale(host) {
      if (!host) return;
      if (layoutMode === 'paged') {
        sizeEngravingPaged(host);
        return;
      }
      const wrap = document.getElementById('wrap');
      const laneH = wrap && wrap.clientHeight > 40 ? wrap.clientHeight : 0;
      const pages = rootPageSvgs(host);
      const dims = [];
      let maxVbH = 0;
      let inkReport = 0;
      pages.forEach((pageSvg) => {
        const cropped = cropStripViewBoxToSystem(pageSvg);
        let vbW = 0;
        let vbH = 0;
        try {
          const vb = pageSvg.viewBox && pageSvg.viewBox.baseVal;
          if (vb && vb.width > 0 && vb.height > 0) {
            vbW = vb.width;
            vbH = vb.height;
          }
        } catch (_) { /* ignore */ }
        // Cropped system height wins. Page getBBox includes the empty page rect
        // and would paint the cream well back under the staff.
        if (cropped > 40) {
          vbH = cropped;
          if (cropped > inkReport) inkReport = cropped;
        }
        if (!(vbW > 0)) vbW = 800;
        if (!(vbH > 0)) vbH = 220;
        dims.push({ vbW: vbW, vbH: vbH });
        if (vbH > maxVbH) maxVbH = vbH;
      });
      // Only the cropped system — a full page viewBox must not become the lane.
      window.__pfStripInkPx = inkReport > 40 ? Math.round(inkReport) : 0;
      // Extra pad so bass ledger lines stay above #wrap clip edge.
      const BOTTOM_PAD = 16;
      let fit = 1;
      if (laneH > 0 && maxVbH > 0) {
        const avail = Math.max(40, laneH - BOTTOM_PAD);
        if (maxVbH > avail) fit = avail / maxVbH;
      }
      window.__pfStripFit = fit;
      // Always top-align before measuring placement (avoids mid-frame center clip).
      host.style.alignItems = 'flex-start';
      pages.forEach((pageSvg, i) => {
        try {
          const d = dims[i] || { vbW: 800, vbH: 220 };
          const w = Math.max(120, Math.round(d.vbW * fit));
          const h = Math.max(80, Math.round(Math.max(d.vbH, maxVbH) * fit));
          pageSvg.removeAttribute('height');
          pageSvg.removeAttribute('width');
          pageSvg.setAttribute('preserveAspectRatio', 'xMinYMin meet');
          pageSvg.style.height = h + 'px';
          pageSvg.style.width = w + 'px';
          pageSvg.style.maxHeight = 'none';
          pageSvg.style.display = 'inline-block';
          pageSvg.style.flex = '0 0 auto';
          pageSvg.style.background = '#FFFBF5';
          pageSvg.style.verticalAlign = 'top';
          pageSvg.style.overflow = 'visible';
        } catch (_) { /* ignore */ }
      });
      placeEngravingInLane(host);
      // Re-assert bar width after layout so a prior fat width cannot stick.
      const ph = document.getElementById('playhead');
      if (ph) {
        const barW = Math.max(5, Math.min(12, Math.round(12 * Math.min(1, fit))));
        ph.style.width = barW + 'px';
        ph.style.maxWidth = barW + 'px';
        ph.style.minWidth = barW + 'px';
        ph.style.transform = 'none';
      }
    }

    /** Fit each Verovio page to the browse lane width.
     *
     * Do **not** derive CSS size from measureStaffSpan ÷ viewBox: staff path
     * coordinates live in definition-scale space while page viewBox is in page
     * units — that ratio collapses every page into a thin centered column.
     * Within-system equal bar widths still come from equalizeMeasureWidths.
     */
    function sizeEngravingPaged(host) {
      if (!host) return;
      const wrap = document.getElementById('wrap');
      const laneW = wrap && wrap.clientWidth > 40 ? wrap.clientWidth : (window.innerWidth || 800);
      const availW = Math.max(200, laneW - 16);
      const pages = rootPageSvgs(host);
      host.style.display = 'flex';
      host.style.flexDirection = 'column';
      host.style.flexWrap = 'nowrap';
      host.style.alignItems = 'center';
      host.style.width = '100%';
      host.style.minHeight = '0';
      host.style.transform = 'none';
      pages.forEach((pageSvg, i) => {
        try {
          let vbW = 800;
          let vbH = 1100;
          try {
            const vb = pageSvg.viewBox && pageSvg.viewBox.baseVal;
            if (vb && vb.width > 0 && vb.height > 0) {
              vbW = vb.width;
              vbH = vb.height;
            }
          } catch (_) { /* ignore */ }
          const fit = availW / Math.max(1, vbW);
          const w = Math.max(200, Math.round(availW));
          const h = Math.max(120, Math.round(vbH * fit));
          pageSvg.removeAttribute('height');
          pageSvg.removeAttribute('width');
          pageSvg.setAttribute('preserveAspectRatio', 'xMidYMin meet');
          pageSvg.setAttribute('data-pf-page', String(i + 1));
          pageSvg.style.height = h + 'px';
          pageSvg.style.width = w + 'px';
          pageSvg.style.maxWidth = '100%';
          pageSvg.style.maxHeight = 'none';
          pageSvg.style.display = 'block';
          pageSvg.style.flex = '0 0 auto';
          pageSvg.style.background = '#FFFBF5';
          pageSvg.style.overflow = 'visible';
        } catch (_) { /* ignore */ }
      });
      contentCenterPadX = 0;
      scrollX = 0;
      window.__pfStripFit = 1;
      logHost('pagedFit pages=' + pages.length + ' availW=' + Math.round(availW));
    }

    function renderSvgHost() {
      const pageCount = toolkit.getPageCount();
      let html = '';
      for (let p = 1; p <= Math.max(1, pageCount); p++) {
        html += toolkit.renderToSVG(p, {});
      }
      const host = document.getElementById('svg');
      host.innerHTML = html;
      if (layoutMode === 'paged') {
        host.style.display = 'flex';
        host.style.flexDirection = 'column';
        host.style.flexWrap = 'nowrap';
        host.style.alignItems = 'center';
        host.style.minHeight = '0';
        host.style.width = '100%';
        host.style.transform = 'none';
        setBrowseChrome(true);
      } else {
        // Multi-page must be a horizontal strip — vertical stack breaks beat→X scroll.
        host.style.display = 'flex';
        host.style.flexDirection = 'row';
        host.style.flexWrap = 'nowrap';
        host.style.minHeight = '0';
        host.style.width = 'max-content';
        // Top-align before sizing; placeEngravingInLane keeps top + may pad X.
        host.style.alignItems = 'flex-start';
        setBrowseChrome(false);
      }
      equalizeMeasureWidths(host);
      polishMeasureNumbers(host);
      sizeEngravingFixedScale(host);
      const notes = host.querySelectorAll('g.note').length;
      if (!notes) {
        setStatus('谱面渲染为空（无音符）');
      } else {
        setStatus('');
      }
    }

    /** Dart probes this after pfLoad — detect blank staff and force reload. */
    window.pfScoreInfo = function () {
      try {
        const host = document.getElementById('svg');
        if (!host) {
          return JSON.stringify({
            pages: 0, notes: 0, width: 0, height: 0, ready: !!ready,
            err: 'no-host', loadErr: lastLoadErr,
          });
        }
        const page = host.querySelector('svg');
        // Verovio 4/5 use g.note; also count noteheads as fallback.
        const notes = host.querySelectorAll('g.note').length;
        const heads = host.querySelectorAll('.notehead, g.notehead').length;
        let w = 0;
        let h = 0;
        if (page) {
          const r = page.getBoundingClientRect();
          w = r.width;
          h = r.height;
        }
        const info = {
          pages: rootPageSvgs(host).length,
          notes: Math.max(notes, heads),
          noteGroups: notes,
          heads: heads,
          width: w,
          height: h,
          inkHeight: window.__pfStripInkPx || 0,
          ready: !!ready,
          htmlLen: (host.innerHTML || '').length,
        };
        if (lastLoadErr) info.loadErr = lastLoadErr;
        return JSON.stringify(info);
      } catch (e) {
        return JSON.stringify({
          pages: 0, notes: 0, width: 0, height: 0, ready: !!ready,
          err: String(e), loadErr: lastLoadErr,
        });
      }
    };

    /**
     * Assemble MusicXML from Dart-pushed chunks (WebView2 cannot take ~400KB
     * inline in one executeScript; file XHR from file:// is also unreliable).
     * Usage: pfLoadBegin(); pfLoadChunk("..."); ...; pfLoadEnd(options);
     */
    /**
     * Blank the host and freeze playhead — used on song switch so the previous
     * piece cannot scroll under a new Dart transport.
     */
    window.pfClearScore = function () {
      try {
        if (scrollRaf != null) {
          cancelAnimationFrame(scrollRaf);
          scrollRaf = null;
        }
        ready = false;
        lastMusicXml = '';
        timemap = [];
        beatXPoints = [];
        lastBeats = 0;
        displayBeats = 0;
        beatsPerSec = 0;
        lastSyncTime = 0;
        forceSnap = true;
        layoutMode = 'strip';
        currentBrowsePage = 1;
        setBrowseChrome(false);
        resetScrollTransform();
        const host = document.getElementById('svg');
        if (host) host.innerHTML = '';
        lastLoadErr = null;
        window.__pfStripInkPx = 0;
        setStatus('');
        logHost('pfClearScore');
        return true;
      } catch (e) {
        logHost('pfClearScore exception ' + e);
        return false;
      }
    };

    window.pfLoadBegin = function () {
      window.__pfXmlParts = [];
      return true;
    };
    window.pfLoadChunk = function (part) {
      if (!window.__pfXmlParts) window.__pfXmlParts = [];
      window.__pfXmlParts.push(String(part || ''));
      return window.__pfXmlParts.length;
    };
    window.pfLoadEnd = function (options) {
      const parts = window.__pfXmlParts || [];
      window.__pfXmlParts = [];
      const xml = parts.join('');
      const meta = {
        parts: parts.length,
        xmlLen: xml.length,
        head: xml.slice(0, 48),
        ok: false,
      };
      if (xml.length < 32) {
        meta.err = 'empty-chunks';
        window.__pfLastLoadMeta = JSON.stringify(meta);
        setStatus('谱面分块为空');
        logHost('pfLoadEnd empty parts=' + parts.length);
        return false;
      }
      const ok = !!pfLoad(xml, options);
      meta.ok = ok;
      try {
        meta.pageCount = toolkit ? toolkit.getPageCount() : 0;
      } catch (_) {
        meta.pageCount = -1;
      }
      window.__pfLastLoadMeta = JSON.stringify(meta);
      logHost('pfLoadEnd ' + window.__pfLastLoadMeta);
      return ok;
    };

    /**
     * Preferred: async fetch MusicXML from localhost HTTP, then engrave.
     * Returns "scheduled" immediately; Dart polls pfScoreInfo for notes/loadErr.
     */
    window.pfLoadFromUrlAsync = function (url, options) {
      lastLoadErr = null;
      if (!ensureToolkit()) {
        pendingLoad = { url: url, options: options || {} };
        setStatus('等待谱面引擎…');
        logHost('pfLoadFromUrlAsync queued (toolkit pending)');
        return 'pending';
      }
      setStatus('正在加载乐谱…');
      logHost('pfLoadFromUrlAsync ' + url);
      (async function () {
        try {
          const resp = await fetch(url, { cache: 'no-store' });
          if (!resp.ok) {
            lastLoadErr = 'HTTP ' + resp.status;
            setStatus('谱面加载失败 ' + lastLoadErr);
            logHost('pfLoadFromUrlAsync fetch fail ' + lastLoadErr);
            return;
          }
          const text = await resp.text();
          if (!text || text.length < 32) {
            lastLoadErr = 'empty-xml len=' + (text ? text.length : 0);
            setStatus('谱面文件过短');
            logHost('pfLoadFromUrlAsync ' + lastLoadErr);
            return;
          }
          logHost('pfLoadFromUrlAsync fetched xmlLen=' + text.length);
          const ok = !!pfLoad(text, options);
          if (!ok) {
            lastLoadErr = lastLoadErr || 'engrave-empty';
            logHost('pfLoadFromUrlAsync engrave empty');
          } else {
            lastLoadErr = null;
            logHost('pfLoadFromUrlAsync OK');
          }
        } catch (e) {
          lastLoadErr = String(e);
          setStatus('谱面异步加载异常: ' + e);
          logHost('pfLoadFromUrlAsync exception ' + e);
        }
      })();
      return 'scheduled';
    };

    /**
     * Sync XHR fallback (works on http://127.0.0.1; may fail under file://).
     */
    window.pfLoadFromUrl = function (url, options) {
      lastLoadErr = null;
      if (!toolkit) {
        lastLoadErr = 'not-ready';
        setStatus('谱面引擎未就绪');
        return false;
      }
      try {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, false);
        xhr.send(null);
        const okHttp = xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300);
        if (!okHttp) {
          lastLoadErr = 'HTTP ' + xhr.status;
          setStatus('谱面文件加载失败 HTTP ' + xhr.status);
          return false;
        }
        const text = xhr.responseText || '';
        if (text.length < 32) {
          lastLoadErr = 'empty-xml len=' + text.length;
          setStatus('谱面文件过短');
          return false;
        }
        const ok = !!pfLoad(text, options);
        if (!ok) lastLoadErr = lastLoadErr || 'engrave-empty';
        return ok;
      } catch (e) {
        lastLoadErr = String(e);
        setStatus('谱面文件加载异常: ' + e);
        return false;
      }
    };

    window.pfLoad = function (musicXml, options) {
      if (!toolkit) {
        lastLoadErr = 'not-ready';
        setStatus('谱面引擎未就绪');
        return false;
      }
      try {
        bpm = (options && options.bpm) || 100;
        lastMusicXml = stripPartLabels(musicXml || '');
        if (!lastMusicXml || lastMusicXml.length < 32) {
          lastLoadErr = 'MusicXML empty';
          setStatus('MusicXML 为空');
          return false;
        }
        lastLoadErr = null;
        logHost('pfLoad xmlLen=' + lastMusicXml.length);

        function engrave(mode) {
          const lay = layoutOptions(options || {}, lastMusicXml);
          layoutMode = lay.layoutMode === 'paged' ? 'paged' : 'strip';
          let scale = (options && options.scale) || lay.scale;
          let pageHeight = lay.pageHeight;
          let pageWidth = lay.pageWidth;
          // Strip: continuous single system. Paged: Verovio auto page breaks.
          const breaksMode = layoutMode === 'paged' ? 'auto' : 'none';
          if (layoutMode === 'paged') {
            applyToolkitOptions(lay, scale, pageHeight, pageWidth, breaksMode);
            logHost('engrave PAGED pageWidth=' + pageWidth + ' pageHeight=' + pageHeight + ' scale=' + scale + ' breaks=auto');
          } else if (mode === 'safe') {
            // Keep breaks:none; slightly shorter page + modest width floor.
            pageWidth = Math.max(4000, Math.min(pageWidth, Math.max(4000, lay.measures * 200)));
            pageHeight = Math.max(520, Math.min(pageHeight, 720));
            applyToolkitOptions(lay, scale, pageHeight, pageWidth, breaksMode);
            logHost('engrave SAFE pageWidth=' + pageWidth + ' pageHeight=' + pageHeight + ' scale=' + scale + ' breaks=none');
          } else if (mode === 'narrow') {
            // Keep the same engraver scale — only shrink page metrics so notes
            // stay the same size as successful NORM engraves.
            pageWidth = Math.max(4000, Math.min(pageWidth, Math.max(4000, lay.measures * 180)));
            pageHeight = Math.max(500, Math.min(pageHeight, 700));
            applyToolkitOptions(lay, scale, pageHeight, pageWidth, breaksMode);
            logHost('engrave NARROW pageWidth=' + pageWidth + ' pageHeight=' + pageHeight + ' scale=' + scale + ' breaks=none');
          } else {
            applyToolkitOptions(lay, scale, pageHeight, pageWidth, breaksMode);
            logHost('engrave NORM pageWidth=' + pageWidth + ' pageHeight=' + pageHeight + ' measures=' + lay.measures + ' breaks=none');
          }
          const loaded = toolkit.loadData(lastMusicXml);
          if (loaded === false) {
            logHost('loadData returned false');
            return false;
          }
          try {
            timemap = toolkit.renderToTimemap({ includeRests: true, includeMeasures: true }) || [];
            timemap.sort((a, b) => (a.qstamp || 0) - (b.qstamp || 0));
          } catch (e) {
            timemap = [];
          }
          renderSvgHost();
          const host = document.getElementById('svg');
          const n = host ? host.querySelectorAll('g.note, .notehead').length : 0;
          logHost('engrave notes=' + n + ' htmlLen=' + (host ? host.innerHTML.length : 0) + ' pages=' + (toolkit.getPageCount ? toolkit.getPageCount() : '?'));
          return n > 0;
        }

        let ok = engrave('norm');
        if (!ok && layoutMode !== 'paged') {
          logHost('retry engrave with safe options');
          ok = engrave('safe');
        }
        if (!ok && layoutMode !== 'paged') {
          logHost('retry engrave with narrow+none');
          ok = engrave('narrow');
        }
        if (!ok) {
          lastLoadErr = 'engrave-empty';
        }

        if (scrollRaf != null) {
          cancelAnimationFrame(scrollRaf);
          scrollRaf = null;
        }
        resetScrollTransform();
        beatXPoints = [];
        targetContentX = 0;
        lastBeats = 0;
        displayBeats = 0;
        beatsPerSec = 0;
        lastSyncTime = 0;
        forceSnap = true;
        currentBrowsePage = 1;
        ready = true;
        afterLayout(() => {
          // Size + lane placement first, then measure (pad affects content X).
          const host = document.getElementById('svg');
          sizeEngravingFixedScale(host);
          if (layoutMode === 'paged') {
            const wrap = document.getElementById('wrap');
            if (wrap) wrap.scrollTop = 0;
            currentBrowsePage = 1;
          } else {
            rebuildBeatXPoints();
            updatePlayhead(lastBeats, true);
          }
        });
        return ok;
      } catch (e) {
        ready = false;
        lastLoadErr = String(e);
        setStatus('谱面加载异常: ' + e);
        logHost('pfLoad exception ' + e);
        return false;
      }
    };

    /**
     * Re-engrave for a new viewport size without reloading MusicXML from Flutter.
     * Prefer redoLayout; fall back to loadData(lastMusicXml).
     */
    window.pfResize = function (options) {
      if (!toolkit || !ready || !lastMusicXml) return false;
      const lay = layoutOptions(options || {}, lastMusicXml);
      layoutMode = lay.layoutMode === 'paged' ? 'paged' : 'strip';
      const scale = (options && options.scale) || lay.scale;
      const pageHeight = (options && options.pageHeight) || lay.pageHeight;
      const pageWidth = lay.pageWidth;
      const wrap = document.getElementById('wrap');
      const keepBeats = lastBeats;
      const breaksMode = layoutMode === 'paged' ? 'auto' : 'none';

      applyToolkitOptions(lay, scale, pageHeight, pageWidth, breaksMode);
      try {
        if (typeof toolkit.redoLayout === 'function') {
          toolkit.redoLayout();
        } else {
          toolkit.loadData(lastMusicXml);
        }
      } catch (e) {
        try {
          toolkit.loadData(lastMusicXml);
        } catch (e2) {
          return false;
        }
      }

      renderSvgHost();
      afterLayout(() => {
        sizeEngravingFixedScale(document.getElementById('svg'));
        if (layoutMode === 'paged') {
          pfSetPage(currentBrowsePage || 1);
        } else {
          rebuildBeatXPoints();
          updatePlayhead(keepBeats, true);
        }
      });
      return true;
    };

    /** Browse mode: page count + current page (1-based). */
    window.pfPageInfo = function () {
      try {
        const count = toolkit && typeof toolkit.getPageCount === 'function'
          ? toolkit.getPageCount()
          : 0;
        const host = document.getElementById('svg');
        const rendered = host ? rootPageSvgs(host).length : 0;
        return JSON.stringify({
          layoutMode: layoutMode,
          pageCount: Math.max(count, rendered, 1),
          page: currentBrowsePage || 1,
          ready: !!ready,
        });
      } catch (e) {
        return JSON.stringify({
          layoutMode: layoutMode,
          pageCount: 0,
          page: 1,
          ready: !!ready,
          err: String(e),
        });
      }
    };

    /** Jump to 1-based page; scrolls that SVG into view (browse mode). */
    window.pfSetPage = function (page) {
      if (!ready) return false;
      const host = document.getElementById('svg');
      const wrap = document.getElementById('wrap');
      if (!host || !wrap) return false;
      const pages = rootPageSvgs(host);
      const count = Math.max(1, pages.length);
      let p = Math.floor(Number(page) || 1);
      if (p < 1) p = 1;
      if (p > count) p = count;
      currentBrowsePage = p;
      const el = pages[p - 1];
      if (!el) return false;
      try {
        const top = el.offsetTop - 8;
        wrap.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      } catch (_) {
        wrap.scrollTop = Math.max(0, el.offsetTop - 8);
      }
      return true;
    };

    window.pfNextPage = function () {
      return pfSetPage((currentBrowsePage || 1) + 1);
    };

    window.pfPrevPage = function () {
      return pfSetPage((currentBrowsePage || 1) - 1);
    };

    window.pfTransportReady = function () {
      if (!ready || !toolkit) return false;
      try {
        const host = document.getElementById('svg');
        if (!host) return false;
        const notes = host.querySelectorAll('g.note, .notehead').length;
        if (!(notes > 0)) return false;
        return beatXPoints.length > 0 || timemap.length > 0;
      } catch (_) {
        return false;
      }
    };

    /**
     * Host scrub mapping: content CSS px ↔ transport beats (grab-the-score feel).
     * Used by Flutter / Android / Web gesture layers — not for programmatic follow-scroll.
     */
    window.pfScrubMetrics = function () {
      try {
        const wrap = document.getElementById('wrap');
        const viewW = wrap ? (wrap.clientWidth || 0) : 0;
        let contentW = 0;
        if (wrap) {
          contentW = maxScrollX(wrap) + viewW;
        }
        if (!(contentW > 0)) {
          const host = document.getElementById('svg');
          if (host) contentW = host.scrollWidth || 0;
        }
        let endQ = 0;
        if (beatXPoints.length) {
          endQ = beatXPoints[beatXPoints.length - 1].q || 0;
        } else if (timemap.length) {
          endQ = timemap[timemap.length - 1].qstamp || 0;
        }
        return JSON.stringify({
          contentW: contentW,
          endQ: endQ,
          viewW: viewW,
          ready: !!ready,
        });
      } catch (e) {
        return JSON.stringify({
          contentW: 0, endQ: 0, viewW: 0, ready: !!ready, err: String(e),
        });
      }
    };

    /**
     * @param snap  jump scroll immediately (load / intentional seek)
     * @param rate  beats/sec from Dart (0 = paused). Omit → keep previous rate.
     */
    window.pfSetPosition = function (beats, snap, rate) {
      if (!ready || !toolkit) return;
      // Full-score browse owns vertical scroll — ignore transport follow.
      if (layoutMode === 'paged') return;
      const raw = Number(beats);
      let b = Number.isFinite(raw) ? raw : 0;
      const now = performance.now();
      // Trust Dart snap only — freeze/unfreeze/end-hang must ease.
      const seekSnap = !!snap;

      if (typeof rate === 'number' && Number.isFinite(rate) && rate >= 0) {
        beatsPerSec = rate;
      } else if (seekSnap) {
        beatsPerSec = 0;
      }

      lastBeats = b;
      lastSyncTime = now;
      updatePlayhead(b, seekSnap || forceSnap);
      if (seekSnap) forceSnap = false;
      // System WebView may throttle rAF — advance scroll/playhead on every bridge tick.
      tickSmoothScroll(now);
    };

    function onVisibilityResume() {
      if (document.hidden) return;
      if (beatsPerSec > 0 || Math.abs(scrollX - targetContentX) > 0.5) {
        startSmoothScroll(true);
      }
    }

    function boot() {
      if (typeof verovio === 'undefined') {
        setStatus('缺少 verovio-toolkit-wasm.js，请运行 scripts/download-verovio.ps1');
        return;
      }
      document.addEventListener('visibilitychange', onVisibilityResume);
      window.addEventListener('focus', onVisibilityResume);
      const mod = verovio.module;
      if (mod && (mod.calledRun || mod.ready)) {
        ensureToolkit();
      } else if (mod) {
        mod.onRuntimeInitialized = function () {
          ensureToolkit();
        };
      }
    }
    boot();
  </script>
</body>
</html>
